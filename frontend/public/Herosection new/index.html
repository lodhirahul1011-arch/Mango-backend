<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PIO Scroll Hero Preview</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101215;color:#fff;font-family:system-ui}header{position:absolute;z-index:2;top:20px;left:6%;font-weight:900;font-size:28px}.sequence{height:300svh}.stage{height:100svh;position:sticky;top:0;display:flex;flex-direction:column;justify-content:center;overflow:hidden}.copy{position:absolute;top:12%;left:6%;z-index:1;pointer-events:none}h1{font-size:clamp(32px,5vw,76px);margin:0;line-height:1}p{color:#ddd}canvas{display:block;width:100%;height:100%;background:#101215}.hint{position:absolute;bottom:20px;width:100%;text-align:center;color:#ccc;font-size:13px}footer{min-height:50vh;padding:8vw;background:#f6e8cf;color:#222}a{color:inherit}@media(max-width:767px){.copy{position:relative;top:auto;left:auto;padding:65px 6% 20px}.stage{justify-content:center}canvas{height:48svh;flex-shrink:0}.sequence{height:240svh}}@media(prefers-reduced-motion:reduce){.sequence{height:auto}.stage{position:relative}}
</style><header>PIO</header><section class="sequence"><div class="stage"><div class="copy"><h1>Har Sip PIO.</h1><p>Mango &amp; Lychee</p></div><canvas aria-label="PIO Mango and Lychee product animation" role="img"></canvas><div class="hint" id="status">Loading first frame…</div></div></section><footer><h2>Your next website section</h2><p>Preview content only. Preserve your existing website copy during integration.</p></footer>
<script type="module">
const manifest=await fetch('./manifest.json').then(r=>{if(!r.ok)throw Error('Manifest load failed');return r.json()});
const mobile=matchMedia('(max-width:767px)').matches, reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
const cfg=manifest[mobile?'mobile':'desktop'], canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),section=document.querySelector('.sequence'),status=document.querySelector('#status');
const cache=new Map(), pending=new Set(),failed=new Set();let queue=[],active=0,target=0,shown=-1,raf=0;
const url=i=>`./${cfg.folder}/frame-${String(i).padStart(4,'0')}.webp`;
function draw(){raf=0;let best=cache.has(target)?target:[...cache.keys()].sort((a,b)=>Math.abs(a-target)-Math.abs(b-target))[0];if(best===undefined)return;const im=cache.get(best);ctx.clearRect(0,0,canvas.width,canvas.height);const s=Math.min(canvas.width/im.width,canvas.height/im.height);ctx.drawImage(im,(canvas.width-im.width*s)/2,(canvas.height-im.height*s)/2,im.width*s,im.height*s);shown=best;status.textContent=reduced?'Reduced motion: static product image':'Scroll to explore · '+(target+1)+' / '+cfg.count;}
function render(){if(!raf)raf=requestAnimationFrame(draw)}
function pump(){while(active<4&&queue.length){const i=queue.shift();if(cache.has(i)||pending.has(i)||failed.has(i))continue;active++;pending.add(i);const im=new Image();im.decoding='async';im.onload=()=>{cache.set(i,im);pending.delete(i);active--;while(cache.size>32){const far=[...cache.keys()].sort((a,b)=>Math.abs(b-target)-Math.abs(a-target))[0];cache.delete(far)}render();pump()};im.onerror=()=>{pending.delete(i);failed.add(i);active--;if(!cache.size)status.textContent='Frame load failed. Check paths and serve via HTTP.';pump()};im.src=url(i)}}
function requestFrames(){queue=[];for(let d=0;d<=12;d++){for(const i of d?[target+d,target-d]:[target])if(i>=0&&i<cfg.count&&!cache.has(i)&&!pending.has(i)&&!failed.has(i))queue.push(i)}pump()}
function update(){const rect=section.getBoundingClientRect();const progress=reduced?0:Math.max(0,Math.min(1,-rect.top/Math.max(1,section.offsetHeight-innerHeight)));const next=Math.round(progress*(cfg.count-1));if(next!==target||!cache.size){target=next;requestFrames();render()}}
function resize(){const dpr=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.round(canvas.clientWidth*dpr);canvas.height=Math.round(canvas.clientHeight*dpr);render();update()}
addEventListener('scroll',update,{passive:true});addEventListener('resize',resize);resize();requestFrames();
</script></html>
